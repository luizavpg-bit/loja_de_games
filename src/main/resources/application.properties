# ===== Banco de Dados =====
# Ajuste conforme seu ambiente (MySQL usado como exemplo).
# Pode sobrescrever via variaveis de ambiente DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_lojagames?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Em producao, defina JWT_SECRET como variavel de ambiente (nao deixe hardcoded).
jwt.secret=${JWT_SECRET:5227566D5970337336763979244226452948404D635166546A576E5A723475}
# 1 hora em millisegundos
jwt.expiration=${JWT_EXPIRATION:3600000}

server.error.include-stacktrace=never
